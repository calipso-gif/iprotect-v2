<body>

  <div class="container">

    <div class="logo-box">
  <img src="logo.png" class="logo-img">
</div>

    <h1>Créer un compte</h1>
    <p class="subtitle">Rejoignez I-PROTECT</p>

    <form id="signup-form">

      <div class="form-group">
        <label>Nom et prénom</label>
        <input type="text" id="full_name" required>
      </div>

      <div class="form-group">
        <label>Numéro de téléphone</label>
        <input type="text" id="phone" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label>Modèle du téléphone</label>
        <input type="text" id="phone_model" required>
      </div>

      <div class="form-group">
        <label>Numéro IMEI</label>
        <input type="text" id="imei" required>
      </div>

      <div class="form-group">
        <label>Choisir une formule</label>
        <select id="plan" required>
  <option value="">-- Sélectionner --</option>
  <option value="Starter">Starter - 2 900 FCFA</option>
  <option value="Plus">Plus - 5 900 FCFA</option>
  <option value="Elite">Elite - 9 900 FCFA</option>
</select>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required>
      </div>

      <button class="btn" type="submit">S’inscrire</button>

    </form>

    <div class="bottom">
      Déjà un compte ? <a href="connexion.html">Se connecter</a>
    </div>

    <div class="note">
      Service d’assistance et de réparation téléphone par abonnement.  
      Ce service n’est pas une assurance.
    </div>

  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://tzwltqnkolkgemdhiimp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6d2x0cW5rb2xrZ2VtZGhpaW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzk3MDIsImV4cCI6MjA5MjkxNTcwMn0.9_xIrz6030zEoGFhD6iPN3cq6Z8_aZsDuLVipeY5D0o";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("signup-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const full_name = document.getElementById("full_name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone_model = document.getElementById("phone_model").value.trim();
  const imei = document.getElementById("imei").value.trim();
  const plan = document.getElementById("plan").value;
  const password = document.getElementById("password").value;

  let plafond = 0;
  if (plan === "Starter") plafond = 40000;
  if (plan === "Plus") plafond = 80000;
  if (plan === "Elite") plafond = 130000;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    alert("Erreur Auth : " + error.message);
    console.error(error);
    return;
  }

  const user = data.user;

  if (!user) {
    alert("Compte créé. Vérifie ton email pour activer ton compte.");
    window.location.href = "connexion.html";
    return;
  }

  const { error: profileError } = await supabaseClient
    .from("profiles")
    .insert({
      id: user.id,
      full_name: full_name,
      phone: phone,
      email: email,
      phone_model: phone_model,
      imei: imei,
      plan: plan,
      role: "client",
      status: "en_attente",
      current_ceiling: plafond,
      initial_ceiling: plafond,
      remaining_ceiling: plafond
    });

  if (profileError) {
    alert("Erreur profil : " + profileError.message);
    console.error(profileError);
    return;
  }

if (typeof fbq === "function") {
  fbq("track", "CompleteRegistration");
}

alert("Inscription réussie !");
window.location.href = "connexion.html";
});
</script>
</body>
