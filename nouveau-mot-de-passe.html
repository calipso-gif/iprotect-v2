<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe | I-PROTECT</title>

  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container {
      width:100%;
      max-width:420px;
      background:white;
      padding:30px;
      border-radius:25px;
      box-shadow:0 20px 60px rgba(0,0,0,0.08);
      border:1px solid #eee;
    }

    .logo-box {
      width:90px;
      height:90px;
      margin:auto;
      margin-bottom:20px;
      border-radius:22px;
      background:#f3e8ff;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo-img {
      width:100%;
      height:100%;
      object-fit:contain;
    }

    h1 {
      text-align:center;
      margin-bottom:10px;
    }

    .subtitle {
      text-align:center;
      color:#666;
      margin-bottom:25px;
      font-size:14px;
    }

    .form-group {
      margin-bottom:18px;
    }

    label {
      display:block;
      margin-bottom:6px;
      font-weight:600;
      font-size:14px;
    }

    input {
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #ddd;
      font-size:14px;
    }

    input:focus {
      outline:none;
      border-color:#7c3aed;
      box-shadow:0 0 0 3px rgba(124,58,237,0.15);
    }

    .btn {
      width:100%;
      padding:15px;
      background:#7c3aed;
      color:white;
      border:none;
      border-radius:16px;
      font-weight:700;
      cursor:pointer;
    }

    .btn:hover {
      background:#6d28d9;
    }

    .bottom {
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .bottom a {
      color:#7c3aed;
      font-weight:700;
      text-decoration:none;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="logo-box">
      <img src="logo.png" class="logo-img">
    </div>

    <h1>Nouveau mot de passe</h1>
    <p class="subtitle">
      Définissez un nouveau mot de passe sécurisé
    </p>

    <form>

      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input type="password" placeholder="Nouveau mot de passe" required>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" placeholder="Confirmer le mot de passe" required>
      </div>

      <button class="btn">Valider</button>

    </form>

    <div class="bottom">
      <a href="connexion.html">Retour à la connexion</a>
    </div>

  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://tzwltqnkolkgemdhiimp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6d2x0cW5rb2xrZ2VtZGhpaW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzk3MDIsImV4cCI6MjA5MjkxNTcwMn0.9_xIrz6030zEoGFhD6iPN3cq6Z8_aZsDuLVipeY5D0o";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm-password").value;

  if (password !== confirmPassword) {
    alert("Les mots de passe ne correspondent pas.");
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({
    password: password
  });

  if (error) {
    alert("Erreur : " + error.message);
    return;
  }

  alert("Mot de passe modifié avec succès.");
  window.location.href = "https://iprotect-ci.vercel.app/connexion.html";
});
</script>
